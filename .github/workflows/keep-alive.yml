# Tiene sveglio il progetto Supabase free chiamando la route keep-alive
# una volta al giorno. Richiede la repository variable KEEP_ALIVE_URL
# (Settings > Secrets and variables > Actions > Variables), per esempio:
#   https://tuodominio.vercel.app/api/keep-alive
name: Keep-alive Supabase

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Chiama la route keep-alive
        if: ${{ vars.KEEP_ALIVE_URL != '' }}
        run: curl --fail --silent --show-error --max-time 90 "${{ vars.KEEP_ALIVE_URL }}"
